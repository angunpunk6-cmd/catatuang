
name: Build CatatUang APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: unzip -o CatatUangAndroid_HP_BuildAPK.zip -d .

      - name: Build debug APK
        run: gradle -p CatatUangAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatUang-APK
          path: CatatUangAndroid/app/build/outputs/apk/debug/app-debug.apk
