
      - name: Find and extract project ZIP
        run: |
          echo "Checking repository files..."
          find . -maxdepth 3 -type f -print
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'CatatUangAndroid_HP_BuildAPK.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found. Searching all ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
